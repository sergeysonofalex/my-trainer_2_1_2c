<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр «Файлы и папки» — Работа с мышью (10 баллов)</title>
<style>
/* ============================================================
   ОБЩИЕ СТИЛИ
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:  #28a745;
  --blue:   #0d6efd;
  --dark:   #1f2937;
  --gray:   #6b7280;
  --border: #dbe7f7;
  --shadow: 0 12px 32px rgba(13, 60, 120, .12);
}

html, body { height: 100%; }

body {
  font-family: 'Segoe UI', 'Trebuchet MS', Tahoma, Verdana, sans-serif;
  font-size: 18px;
  color: var(--dark);
  background: linear-gradient(135deg, #e8f1ff 0%, #f6f9ff 45%, #eaf7f0 100%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.screen { display: none; }
.screen.active { display: block; }

.btn {
  font-family: inherit;
  font-size: 20px;
  font-weight: 600;
  padding: 13px 30px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }

.btn-primary {
  background: linear-gradient(180deg, #3aa0ff, #0d6efd);
  color: #fff;
  box-shadow: 0 6px 16px rgba(13, 110, 253, .35);
}
.btn-primary:hover:not(:disabled) { box-shadow: 0 8px 22px rgba(13, 110, 253, .45); }
.btn-primary:disabled {
  background: #cfd9e6; color: #8b98a8; box-shadow: none; cursor: not-allowed;
}

/* ============================================================
   ЭКРАН АВТОРИЗАЦИИ
   ============================================================ */
#screen-login {
  display: none; min-height: 100vh;
  align-items: center; justify-content: center; padding: 24px;
}
#screen-login.active { display: flex; }

.login-card {
  width: 100%; max-width: 760px; background: #fff;
  border: 1px solid var(--border); border-radius: 28px;
  box-shadow: var(--shadow); padding: 46px 54px 42px; text-align: center;
}
.login-emoji { font-size: 62px; line-height: 1; margin-bottom: 10px; }
.login-card h1 { font-size: 32px; line-height: 1.25; margin-bottom: 10px; color: #123a6b; }
.login-sub { font-size: 19px; color: var(--gray); margin-bottom: 30px; }
.login-label { display: block; text-align: left; font-size: 19px; font-weight: 600; margin-bottom: 10px; color: #123a6b; }

#studentName {
  width: 100%; font-family: inherit; font-size: 24px;
  padding: 15px 20px; border: 3px solid #28a745;
  background: #f0fff4; border-radius: 16px; outline: none;
  color: #14532d; transition: box-shadow .15s ease;
}
#studentName:focus { box-shadow: 0 0 0 5px rgba(40, 167, 69, .18); }

.login-hint { min-height: 26px; margin-top: 10px; font-size: 17px; color: #d97706; font-weight: 600; }
#startBtn { margin-top: 16px; }

/* ============================================================
   ЭКРАН СИМУЛЯТОРА
   ============================================================ */
#screen-sim { padding: 12px 16px 16px; display: none; flex-direction: column; height: 100vh; }
#screen-sim.active { display: flex; }

.s2-top {
  background: #fff; border: 1px solid var(--border);
  border-radius: 18px; padding: 14px 22px 16px;
  box-shadow: 0 6px 18px rgba(13, 60, 120, .08); flex: 0 0 auto;
}
.s2-top-row {
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap; margin-bottom: 10px;
}
.s2-badge {
  font-size: 18px; font-weight: 800; color: #fff;
  background: linear-gradient(180deg, #3aa0ff, #0d6efd);
  border-radius: 999px; padding: 7px 20px; white-space: nowrap;
}
.s2-dots { display: flex; gap: 6px; }
.dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: #dbe7f7; border: 2px solid #c6d8ee; transition: all .25s ease;
}
.dot.done { background: #28a745; border-color: #1e7e34; }
.dot.current { background: #ffc107; border-color: #d39e00; transform: scale(1.15); }

.s2-actions {
  margin-left: auto;
  display: flex;
  gap: 10px;
  align-items: center;
}

.btn-skip {
  font-family: inherit; font-size: 18px;
  font-weight: 800; padding: 11px 22px; border-radius: 13px;
  border: 2px solid #cbd5e1; background: #fff; color: #475569;
  cursor: pointer; transition: all .15s ease; white-space: nowrap;
}
.btn-skip:hover { background: #f1f5f9; border-color: #94a3b8; color: #1e293b; }
.btn-skip:active { transform: translateY(1px); }

.btn-finish {
  font-family: inherit; font-size: 18px;
  font-weight: 800; padding: 11px 22px; border-radius: 13px;
  border: 2px solid #dc2626; background: #dc2626; color: #fff;
  cursor: pointer; transition: all .15s ease; white-space: nowrap;
  box-shadow: 0 4px 12px rgba(220, 38, 38, .3);
}
.btn-finish:hover { background: #b91c1c; border-color: #b91c1c; }
.btn-finish:active { transform: translateY(1px); }

.s2-task {
  font-size: 24px; font-weight: 800; color: #0f2b52;
  line-height: 1.35; margin-bottom: 10px;
}

/* ============================================================
   БЛОК ПОДСКАЗКИ С РИСУНКОМ МЫШИ
   ============================================================ */
.s2-hint {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 19px;
  color: #7c2d12;
  font-weight: 700;
  background: #fff7ed;
  border-left: 6px solid #f59e0b;
  border-radius: 10px;
  padding: 14px 20px;
  line-height: 1.45;
}

.hint-mouse {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.mouse-svg {
  width: 60px;
  height: 90px;
  display: block;
}

.mouse-svg .mouse-body {
  fill: #f8fafc;
  stroke: #334155;
  stroke-width: 3;
}

.mouse-svg .mouse-path {
  fill: #e2e8f0;
  stroke: #334155;
  stroke-width: 3;
  stroke-linejoin: round;
  transition: fill .25s ease;
}

.mouse-svg .mouse-path.active {
  fill: #fbbf24;
  stroke: #d97706;
  stroke-width: 3.5;
  animation: mousePulse 1s ease-in-out infinite;
}

.mouse-svg .mouse-wheel {
  fill: #94a3b8;
  stroke: #334155;
  stroke-width: 2;
}

@keyframes mousePulse {
  0%, 100% {
    fill: #fbbf24;
    filter: drop-shadow(0 0 6px #fbbf24);
  }
  50% {
    fill: #fde047;
    filter: drop-shadow(0 0 16px #fbbf24);
  }
}

.mouse-label {
  font-size: 12px;
  font-weight: 800;
  color: #b45309;
  background: #fef3c7;
  border: 1.5px solid #f59e0b;
  border-radius: 6px;
  padding: 2px 8px;
  white-space: nowrap;
  letter-spacing: .3px;
  text-transform: uppercase;
}

.hint-text {
  flex: 1 1 auto;
}

/* ============================================================
   РАБОЧАЯ ОБЛАСТЬ
   ============================================================ */
.s2-work { flex: 1 1 auto; margin-top: 12px; min-height: 0; display: flex; }
.desktop-area {
  flex: 1; display: flex; flex-direction: column; gap: 10px;
  position: relative; min-height: 0;
}

.desktop {
  flex: 1 1 auto; position: relative; border-radius: 18px;
  background: linear-gradient(160deg, #2f6fbf 0%, #4a9be0 55%, #7fc4f0 100%);
  box-shadow: inset 0 0 60px rgba(0, 0, 0, .12), 0 10px 26px rgba(13, 60, 120, .18);
  padding: 16px 16px 130px 16px;
  display: grid; grid-template-columns: repeat(auto-fill, 116px);
  grid-auto-rows: 116px; gap: 8px; align-content: start;
  overflow: auto; user-select: none;
}
.desktop.drop-active { box-shadow: inset 0 0 0 4px #ffd54f, inset 0 0 60px rgba(0,0,0,.12); }

.dicon {
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; gap: 4px; padding: 8px 4px;
  border-radius: 12px; border: 2px solid transparent;
  cursor: pointer; color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
  transition: background .13s ease, border-color .13s ease;
}
.dicon:hover { background: rgba(255, 255, 255, .18); }
.dicon.selected { background: rgba(255, 255, 255, .28); border-color: rgba(255,255,255,.8); }
.dicon.drop-hover { background: rgba(255, 235, 130, .45); border-color: #ffe082; }

.dicon-img { font-size: 44px; line-height: 1; position: relative; pointer-events: none; }
.dicon-name {
  font-size: 14px; line-height: 1.15; text-align: center;
  word-break: break-word; pointer-events: none; max-width: 108px;
}
.shortcut-arrow {
  position: absolute; right: -8px; bottom: -4px;
  font-size: 17px; color: #fff; background: #0d6efd;
  border-radius: 5px; padding: 0 3px; text-shadow: none;
  border: 1px solid #fff;
}
.folder-badge {
  position: absolute; right: -10px; bottom: -4px;
  background: #ffc107; color: #3b2f00; font-size: 13px;
  font-weight: 800; border-radius: 999px; padding: 1px 8px;
  border: 2px solid #fff; text-shadow: none;
}
.trash-icon { position: absolute; right: 18px; bottom: 18px; width: 108px; z-index: 3; }

.progbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; background: #fff; border: 1px solid var(--border);
  border-radius: 14px; padding: 9px 16px;
  box-shadow: 0 5px 16px rgba(13, 60, 120, .07);
}
.progbar-label { font-size: 15px; font-weight: 700; color: var(--gray); }
.prog-chip {
  display: flex; align-items: center; gap: 8px;
  font-size: 17px; font-weight: 600; padding: 8px 16px;
  border-radius: 12px; background: #eef4ff;
  border: 2px dashed #9dc0f0; cursor: grab; color: #14304f;
}
.prog-chip:active { cursor: grabbing; }

/* Окно папки */
.folder-win {
  position: absolute; left: 40px; top: 40px;
  width: 460px; max-width: 72%; background: #fff;
  border-radius: 14px; box-shadow: 0 18px 44px rgba(0, 0, 0, .3);
  overflow: hidden; z-index: 40; border: 1px solid #cfd8e3;
}
.fw-title {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 14px;
  background: linear-gradient(180deg, #f7fafd, #e9f0f8);
  font-weight: 700; font-size: 17px; border-bottom: 1px solid #dde6f0;
  color: #14304f;
}
.fw-title button {
  border: none; background: #e74c3c; color: #fff;
  width: 28px; height: 28px; border-radius: 8px;
  font-size: 16px; cursor: pointer; font-family: inherit;
}
.fw-body {
  padding: 12px; display: flex; flex-wrap: wrap; gap: 8px;
  min-height: 130px; max-height: 280px; overflow: auto; background: #fbfdff;
}
.fw-empty { color: var(--gray); font-size: 18px; padding: 30px 20px; width: 100%; text-align: center; }
.fw-body .dicon { color: #14304f; text-shadow: none; width: 96px; }
.fw-body .dicon:hover { background: #eaf2ff; }

/* Контекстное меню */
.ctx-menu {
  position: fixed; z-index: 9999; background: #fff;
  border: 1px solid #e0e7f0; border-radius: 12px;
  box-shadow: 0 14px 38px rgba(0, 0, 0, .22);
  padding: 6px; min-width: 250px; font-size: 18px;
  animation: ctxIn .1s ease;
}
@keyframes ctxIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.ctx-item {
  padding: 11px 15px; border-radius: 8px; cursor: pointer;
  white-space: nowrap; color: #1f2937; font-weight: 600;
}
.ctx-item:hover { background: #e8f0fe; }
.ctx-item.disabled { color: #b6bfcb; cursor: default; }
.ctx-item.disabled:hover { background: transparent; }

/* Зоны сортировки */
.sort-wrap { flex: 1; display: flex; gap: 16px; min-height: 0; }
.sort-pool {
  flex: 0 0 300px; background: #fff; border: 1px solid var(--border);
  border-radius: 18px; padding: 14px; overflow: auto;
  box-shadow: 0 5px 16px rgba(13, 60, 120, .07);
  display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start;
}
.pool-title {
  width: 100%; font-size: 16px; font-weight: 800; color: var(--gray);
  text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px;
}
.sort-zones { flex: 1; display: flex; gap: 14px; }
.szone {
  flex: 1; background: #fff; border: 3px dashed #b9d3f2;
  border-radius: 18px; padding: 12px; display: flex;
  flex-direction: column; transition: all .15s ease;
}
.szone.dragover { border-color: #0d6efd; background: #eef5ff; transform: scale(1.01); }
.szone-title {
  font-size: 19px; font-weight: 800; text-align: center;
  color: #14304f; margin-bottom: 10px;
}
.szone-body { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }

.sitem {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; width: 98px; padding: 9px 5px;
  border-radius: 13px; background: #f4f8ff;
  border: 2px solid #dbe7f7; cursor: grab;
  user-select: none; transition: transform .12s ease;
}
.sitem:hover { border-color: #7fb3f0; }
.sitem:active { cursor: grabbing; }
.sitem .ic { font-size: 33px; line-height: 1; position: relative; }
.sitem .nm { font-size: 13px; text-align: center; word-break: break-word; line-height: 1.15; }
.sitem.shake { animation: shake .4s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}

/* Модальное окно */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 35, 60, .45);
  display: none; align-items: center; justify-content: center; z-index: 10000;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 20px; padding: 26px 30px 24px;
  width: 480px; max-width: 92vw; box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
}
.modal-box h3 { font-size: 22px; margin-bottom: 14px; color: #14304f; }
.modal-box input {
  width: 100%; font-family: inherit; font-size: 21px;
  padding: 12px 16px; border: 3px solid #0d6efd;
  border-radius: 13px; outline: none; background: #f5faff;
}
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px; }
.btn-secondary {
  background: #eef2f7; color: #38445a; font-size: 18px; padding: 11px 22px;
}

/* Тост */
.toast {
  position: fixed; left: 50%; bottom: 32px;
  transform: translate(-50%, 24px);
  background: #1f2937; color: #fff; font-size: 18px;
  font-weight: 600; padding: 14px 28px; border-radius: 14px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, .3);
  opacity: 0; pointer-events: none; transition: all .28s ease;
  z-index: 12000; max-width: 80vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.success { background: #1a7f37; }
.toast.error   { background: #b02a37; }

/* Финальный экран */
#screen-final { padding: 26px 20px 40px; }
.final-card {
  max-width: 1000px; margin: 0 auto; background: #fff;
  border: 1px solid var(--border); border-radius: 28px;
  box-shadow: var(--shadow); padding: 38px 46px 40px; text-align: center;
}
.final-emoji { font-size: 74px; line-height: 1; }
.final-card h1 { font-size: 38px; color: #123a6b; margin: 8px 0 6px; }
.final-score { font-size: 26px; font-weight: 700; color: #14304f; margin-bottom: 26px; }
.final-score b { color: #0d6efd; font-size: 40px; }

.desc-table { width: 100%; border-collapse: collapse; margin-bottom: 28px; font-size: 19px; }
.desc-table th {
  background: #eef4ff; color: #14304f; font-size: 18px;
  padding: 13px 16px; text-align: left; border: 1px solid #dbe7f7;
}
.desc-table th:last-child { text-align: center; width: 250px; }
.desc-table td {
  padding: 14px 16px; border: 1px solid #dbe7f7;
  text-align: left; line-height: 1.35;
}
.desc-table td:last-child { text-align: center; font-weight: 700; }

.badge-ok  { color: #1a7f37; background: #e6f8ec; border-radius: 10px; padding: 6px 14px; display: inline-block; }
.badge-rep { color: #b45309; background: #fff4e0; border-radius: 10px; padding: 6px 14px; display: inline-block; }

@media (max-width: 1100px) {
  .sort-pool { flex: 0 0 220px; }
  .dicon-name { font-size: 13px; }
  .s2-task { font-size: 20px; }
  .s2-hint { font-size: 17px; gap: 14px; }
  .mouse-svg { width: 48px; height: 72px; }
}
@media (max-height: 700px) {
  .desktop { grid-auto-rows: 104px; }
  .dicon-img { font-size: 38px; }
  .s2-task { font-size: 20px; }
  .mouse-svg { width: 46px; height: 70px; }
}
</style>
</head>
<body>

<!-- ЭКРАН 1: АВТОРИЗАЦИЯ -->
<section id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-emoji">🖱️📂🗑️</div>
    <h1>Тренажёр «Файлы и папки»<br>Работа с мышью (10 баллов)</h1>
    <p class="login-sub">Цифровая грамотность и ИИ · 2 класс</p>

    <label class="login-label" for="studentName">Введите своё имя:</label>
    <input type="text" id="studentName" placeholder="" autocomplete="off" maxlength="30">
    <div class="login-hint" id="loginHint"></div>

    <button class="btn btn-primary" id="startBtn" disabled>Начать практику</button>
  </div>
</section>

<!-- ЭКРАН 2: СИМУЛЯТОР -->
<section id="screen-sim" class="screen">

  <div class="s2-top">
    <div class="s2-top-row">
      <div class="s2-badge">Задание <span id="s2num">1</span> из 10</div>
      <div class="s2-dots" id="s2dots"></div>
      <div class="s2-actions">
        <button class="btn-skip" id="skipBtn" title="Пропустить это задание и перейти к следующему">Пропустить →</button>
        <button class="btn-finish" id="finishBtn" title="Завершить тренажёр и посмотреть результат">🏁 Завершить</button>
      </div>
    </div>
    <div class="s2-task" id="s2task"></div>

    <!-- Подсказка с рисунком мыши и подсвеченной кнопкой -->
    <div class="s2-hint">
      <div class="hint-mouse">
        <svg class="mouse-svg" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
          <!-- Корпус мыши -->
          <rect class="mouse-body" x="1.5" y="1.5" width="57" height="87" rx="28.5" ry="28.5"/>
          <!-- Левая кнопка -->
          <path id="mouseLeftPath" class="mouse-path" d="M 1.5 30 A 28.5 28.5 0 0 1 30 1.5 L 30 30 Z"/>
          <!-- Правая кнопка -->
          <path id="mouseRightPath" class="mouse-path" d="M 30 1.5 A 28.5 28.5 0 0 1 58.5 30 L 30 30 Z"/>
          <!-- Колёсико -->
          <rect class="mouse-wheel" x="26.5" y="20" width="7" height="11" rx="3.5" ry="3.5"/>
        </svg>
        <div class="mouse-label" id="mouseLabel">ЛКМ</div>
      </div>
      <div class="hint-text" id="hintText"></div>
    </div>
  </div>

  <div class="s2-work">

    <div class="desktop-area" id="desktopArea">
      <div class="desktop" id="desktop"></div>

      <div class="progbar" id="progbar">
        <span class="progbar-label">ПАНЕЛЬ ПРОГРАММ:</span>
      </div>

      <div class="folder-win" id="folderWin" style="display:none">
        <div class="fw-title">
          <span id="fwName">📁 Папка</span>
          <button id="fwClose" title="Закрыть">✕</button>
        </div>
        <div class="fw-body" id="fwBody"></div>
      </div>
    </div>

    <div class="sort-wrap" id="sortWrap" style="display:none">
      <div class="sort-pool" id="sortPool">
        <div class="pool-title">Перетащи значки</div>
      </div>
      <div class="sort-zones">
        <div class="szone" data-kind="file">
          <div class="szone-title">📄 Файлы</div>
          <div class="szone-body"></div>
        </div>
        <div class="szone" data-kind="folder">
          <div class="szone-title">📁 Папки</div>
          <div class="szone-body"></div>
        </div>
        <div class="szone" data-kind="shortcut">
          <div class="szone-title">🔗 Ярлыки</div>
          <div class="szone-body"></div>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- ЭКРАН 3: РЕЗУЛЬТАТ -->
<section id="screen-final" class="screen">
  <div class="final-card">
    <div class="final-emoji">🏆</div>
    <h1>Молодец, <span id="finalName"></span>!</h1>
    <div class="final-score">Ваш результат: <b id="finalScore">0</b> из 10 баллов</div>

    <table class="desc-table">
      <thead>
        <tr><th>Дескриптор успеха</th><th>Результат</th></tr>
      </thead>
      <tbody id="descBody"></tbody>
    </table>

    <button class="btn btn-primary" id="restartBtn">🔄 Пройти практику заново</button>
  </div>
</section>

<!-- Модальное окно -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Переименовать</h3>
    <input type="text" id="modalInput" maxlength="40" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCancel">Отмена</button>
      <button class="btn btn-primary" id="modalOk">OK</button>
    </div>
  </div>
</div>

<!-- Тост -->
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const state = {
  name: "",
  index: 0,
  done: new Array(10).fill(false),
  doneCount: 0,
  desktop: [],
  trash: [],
  clipboard: null,
  programs: [],
  flags: {},
  openFolderId: null,
  sortItems: [],
  sortInit: false
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
let uidCounter = 1;
function uid(prefix) { return (prefix || "id") + "_" + (uidCounter++) + "_" + Date.now().toString(36); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg, type) {
  toastEl.textContent = msg;
  toastEl.className = "toast show" + (type ? " " + type : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = "toast"; }, 2300);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ============================================================
   АВТОРИЗАЦИЯ
   ============================================================ */
const nameInput = document.getElementById("studentName");
const startBtn  = document.getElementById("startBtn");
const loginHint = document.getElementById("loginHint");

nameInput.addEventListener("input", () => {
  const v = nameInput.value.trim();
  startBtn.disabled = v.length < 2;
  loginHint.textContent = (v.length === 1) ? "Введи хотя бы 2 буквы своего имени" : "";
});

nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !startBtn.disabled) startSim();
});

startBtn.addEventListener("click", startSim);

function startSim() {
  const v = nameInput.value.trim();
  if (v.length < 2) return;
  state.name = v;
  initSim();
  showScreen("screen-sim");
}

/* ============================================================
   ЗАДАНИЯ — у каждого указано, какая кнопка мыши нужна
   btn: "left" | "right"
   ============================================================ */
const TASKS = [
  {
    text: "Создай новую папку на Рабочем столе: нажми ПРАВОЙ кнопкой мыши на свободном месте Рабочего стола и выбери «Создать папку».",
    hint: "Нажми правой кнопкой мыши на пустом месте Рабочего стола — откроется меню. Выбери в нём пункт «Создать папку».",
    btn: "right",
    check: () => state.flags.createdFolder === true
  },
  {
    text: "Переименуй новую папку в «Мои уроки»: нажми на папку ПРАВОЙ кнопкой мыши и выбери «Переименовать».",
    hint: "Нажми правой кнопкой мыши на папке и выбери «Переименовать». Введи имя ровно так — Мои уроки — и нажми OK.",
    btn: "right",
    check: () => state.flags.renamed === true
  },
  {
    text: "Найди файл «Доклад.txt» и скопируй его: правая кнопка мыши → «Копировать».",
    hint: "Нажми правой кнопкой мыши на файле «Доклад.txt» и выбери «Копировать». Копия пока не появится — она ждёт в буфере обмена.",
    btn: "right",
    check: () => state.flags.copied === true
  },
  {
    text: "Помести копию файла «Доклад.txt» в папку «Мои уроки»: нажми ПРАВОЙ кнопкой мыши на папку «Мои уроки» и выбери «Вставить».",
    hint: "Нажми правой кнопкой мыши на папке «Мои уроки» и выбери «Вставить». Можно также открыть папку двойным щелчком и нажать правой кнопкой на пустом месте внутри неё.",
    btn: "right",
    check: () => state.flags.pasted === true
  },
  {
    text: "Удали лишний файл «Мусор.txt»: нажми на него ПРАВОЙ кнопкой мыши и выбери «Удалить».",
    hint: "Нажми правой кнопкой мыши на файле «Мусор.txt» и выбери «Удалить». Файл отправится в Корзину 🗑️ в правом нижнем углу.",
    btn: "right",
    check: () => state.trash.some(i => i.name === "Мусор.txt")
  },
  {
    text: "Перетащи файл «Фото.png» мышью внутрь папки «Рисунки».",
    hint: "Нажми ЛЕВОЙ кнопкой мыши на файл «Фото.png», не отпуская, тяни его к папке «Рисунки» и отпусти. Когда папка подсветится — отпусти кнопку.",
    btn: "left",
    check: () => state.flags.movedPhoto === true
  },
  {
    text: "Перетащи ярлык программы «🎨 Paint» с Панели программ на Рабочий стол.",
    hint: "Нажми ЛЕВОЙ кнопкой мыши на ярлык «🎨 Paint» в нижней панели, тяни его вверх на Рабочий стол и отпусти.",
    btn: "left",
    check: () => state.flags.shortcutOnDesktop === true
  },
  {
    text: "Перенеси ВСЕ файлы 📄 в зону «Файлы».",
    hint: "Нажми ЛЕВОЙ кнопкой мыши на файле и перетащи его в левую зону «Файлы». Файлы — это значки с именем (Доклад.txt, Фото.png, Песня.mp3).",
    btn: "left",
    check: () => state.sortItems.filter(i => i.kind === "file").every(i => i.zone === "file")
  },
  {
    text: "Перенеси ВСЕ папки 📁 в зону «Папки».",
    hint: "Нажми ЛЕВОЙ кнопкой мыши на папке и перетащи её в среднюю зону «Папки». У папки нет стрелочки в уголке.",
    btn: "left",
    check: () => state.sortItems.filter(i => i.kind === "folder").every(i => i.zone === "folder")
  },
  {
    text: "Перенеси ВСЕ ярлыки 🔗 в зону «Ярлыки».",
    hint: "Нажми ЛЕВОЙ кнопкой мыши на ярлыке и перетащи его в правую зону «Ярлыки». У ярлыка в уголке есть стрелочка ↗.",
    btn: "left",
    check: () => state.sortItems.filter(i => i.kind === "shortcut").every(i => i.zone === "shortcut")
  }
];

const SORT_SOURCE = [
  { id: "s1", name: "Доклад.txt", kind: "file",     icon: "📄" },
  { id: "s2", name: "Фото.png",   kind: "file",     icon: "🖼️" },
  { id: "s3", name: "Песня.mp3",  kind: "file",     icon: "🎵" },
  { id: "s4", name: "Рисунки",    kind: "folder",   icon: "📁" },
  { id: "s5", name: "Документы",  kind: "folder",   icon: "📁" },
  { id: "s6", name: "Paint",      kind: "shortcut", icon: "🎨" },
  { id: "s7", name: "Браузер",    kind: "shortcut", icon: "🌐" }
];

function makeInitialDesktop() {
  return [
    { id: "d1", name: "Доклад.txt", kind: "file",   icon: "📄" },
    { id: "d2", name: "Фото.png",   kind: "file",   icon: "🖼️" },
    { id: "d3", name: "Песня.mp3",  kind: "file",   icon: "🎵" },
    { id: "d4", name: "Мусор.txt",  kind: "file",   icon: "📄" },
    { id: "d5", name: "Рисунки",    kind: "folder", icon: "📁", children: [] },
    { id: "d6", name: "Документы",  kind: "folder", icon: "📁", children: [] }
  ];
}

function initSim() {
  state.index = 0;
  state.done = new Array(10).fill(false);
  state.doneCount = 0;
  state.desktop = makeInitialDesktop();
  state.trash = [];
  state.clipboard = null;
  state.programs = [
    { id: "p1", name: "Paint",       icon: "🎨" },
    { id: "p2", name: "Калькулятор", icon: "🧮" }
  ];
  state.flags = {};
  state.openFolderId = null;
  state.sortItems = [];
  state.sortInit = false;

  document.getElementById("folderWin").style.display = "none";
  document.getElementById("sortWrap").style.display = "none";
  document.getElementById("desktopArea").style.display = "flex";

  renderDesktop();
  renderProgramBar();
  renderTask();
}

/* ============================================================
   РАБОЧИЙ СТОЛ
   ============================================================ */
function renderDesktop() {
  const dt = document.getElementById("desktop");
  dt.innerHTML = "";

  state.desktop.forEach(item => dt.appendChild(makeDesktopIcon(item)));

  const trash = document.createElement("div");
  trash.className = "dicon trash-icon";
  trash.id = "trashIcon";
  trash.innerHTML =
    '<div class="dicon-img">🗑️' +
    (state.trash.length ? '<span class="folder-badge">' + state.trash.length + '</span>' : '') +
    '</div><div class="dicon-name">Корзина</div>';
  trash.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showContextMenu(e.clientX, e.clientY, [
      { label: "🧹 Очистить Корзину", action: () => {
          if (!state.trash.length) { toast("Корзина уже пуста"); return; }
          state.trash = [];
          renderDesktop();
          toast("Корзина очищена");
      }},
      { label: "📂 Открыть", action: () => toast("В Корзине: " + (state.trash.length ? state.trash.map(i => i.name).join(", ") : "пусто")) }
    ]);
  });
  dt.appendChild(trash);
}

function makeDesktopIcon(item) {
  const el = document.createElement("div");
  el.className = "dicon";
  el.dataset.id = item.id;
  el.draggable = true;

  let inner = item.icon;
  if (item.kind === "folder" && item.children && item.children.length) {
    inner += '<span class="folder-badge">' + item.children.length + '</span>';
  }
  if (item.kind === "shortcut") inner += '<span class="shortcut-arrow">↗</span>';

  el.innerHTML = '<div class="dicon-img">' + inner + '</div>' +
                 '<div class="dicon-name">' + escapeHtml(item.name) + '</div>';

  el.addEventListener("dragstart", (e) => {
    dragData = { from: "desktop", id: item.id };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", item.id);
  });
  el.addEventListener("dragend", () => { dragData = null; });

  if (item.kind === "folder") {
    el.addEventListener("dragover", (e) => {
      if (!dragData || dragData.id === item.id) return;
      e.preventDefault(); e.stopPropagation();
      el.classList.add("drop-hover");
    });
    el.addEventListener("dragleave", () => el.classList.remove("drop-hover"));
    el.addEventListener("drop", (e) => {
      e.preventDefault(); e.stopPropagation();
      el.classList.remove("drop-hover");
      if (!dragData || dragData.id === item.id) return;
      if (dragData.from === "desktop") moveItemIntoFolder(dragData.id, item.id);
      else if (dragData.from === "program") toast("Ярлык нужно перетащить на Рабочий стол, а не в папку");
    });
  }

  el.addEventListener("click", () => {
    document.querySelectorAll(".dicon.selected").forEach(d => d.classList.remove("selected"));
    el.classList.add("selected");
  });
  el.addEventListener("dblclick", () => openItem(item.id));
  el.addEventListener("contextmenu", (e) => {
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll(".dicon.selected").forEach(d => d.classList.remove("selected"));
    el.classList.add("selected");
    showContextMenu(e.clientX, e.clientY, menuForItem(item.id));
  });

  return el;
}

function renderProgramBar() {
  const bar = document.getElementById("progbar");
  Array.from(bar.querySelectorAll(".prog-chip")).forEach(c => c.remove());

  if (!state.programs.length) {
    const empty = document.createElement("span");
    empty.className = "prog-chip";
    empty.style.cursor = "default";
    empty.style.opacity = ".6";
    empty.textContent = "все программы уже на Рабочем столе";
    bar.appendChild(empty);
    return;
  }

  state.programs.forEach(p => {
    const chip = document.createElement("div");
    chip.className = "prog-chip";
    chip.draggable = true;
    chip.innerHTML = "<span>" + p.icon + "</span><span>" + escapeHtml(p.name) + "</span>";
    chip.addEventListener("dragstart", (e) => {
      dragData = { from: "program", programId: p.id, name: p.name, icon: p.icon };
      e.dataTransfer.effectAllowed = "copy";
      e.dataTransfer.setData("text/plain", p.id);
    });
    chip.addEventListener("dragend", () => { dragData = null; });
    chip.addEventListener("dblclick", () => toast("Программу нужно перетащить на Рабочий стол мышью"));
    bar.appendChild(chip);
  });
}

/* ============================================================
   ФАЙЛОВАЯ СИСТЕМА
   ============================================================ */
function allArrays() {
  const arrs = [state.desktop];
  const walk = (list) => {
    list.forEach(i => {
      if (i.kind === "folder" && Array.isArray(i.children)) {
        arrs.push(i.children); walk(i.children);
      }
    });
  };
  walk(state.desktop);
  return arrs;
}

function findItem(id) {
  for (const arr of allArrays()) {
    const f = arr.find(x => x.id === id);
    if (f) return f;
  }
  return null;
}

function removeItem(id) {
  for (const arr of allArrays()) {
    const i = arr.findIndex(x => x.id === id);
    if (i >= 0) return arr.splice(i, 1)[0];
  }
  return null;
}

function moveItemIntoFolder(itemId, folderId) {
  const folder = findItem(folderId);
  if (!folder || folder.kind !== "folder") return;
  const moved = removeItem(itemId);
  if (!moved) return;
  folder.children = folder.children || [];
  folder.children.push(moved);
  if (moved.name === "Фото.png" && folder.name === "Рисунки") {
    state.flags.movedPhoto = true;
  }
  refreshSim();
  toast("«" + moved.name + "» перемещён в папку «" + folder.name + "»");
}

/* ============================================================
   КОНТЕКСТНОЕ МЕНЮ
   ============================================================ */
let ctxMenuEl = null;

function showContextMenu(x, y, items) {
  hideContextMenu();
  const menu = document.createElement("div");
  menu.className = "ctx-menu";

  items.forEach(it => {
    const row = document.createElement("div");
    row.className = "ctx-item" + (it.disabled ? " disabled" : "");
    row.textContent = it.label;
    if (!it.disabled) {
      row.addEventListener("click", (e) => {
        e.stopPropagation(); hideContextMenu(); it.action();
      });
    }
    menu.appendChild(row);
  });

  document.body.appendChild(menu);
  const rect = menu.getBoundingClientRect();
  const px = Math.max(6, Math.min(x, window.innerWidth - rect.width - 8));
  const py = Math.max(6, Math.min(y, window.innerHeight - rect.height - 8));
  menu.style.left = px + "px";
  menu.style.top  = py + "px";
  ctxMenuEl = menu;
}

function hideContextMenu() {
  if (ctxMenuEl && ctxMenuEl.parentNode) ctxMenuEl.parentNode.removeChild(ctxMenuEl);
  ctxMenuEl = null;
}

document.addEventListener("click", hideContextMenu);
document.addEventListener("contextmenu", (e) => {
  if (!e.target.closest("#screen-sim")) hideContextMenu();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideContextMenu(); });
window.addEventListener("resize", hideContextMenu);

function menuForDesktop() {
  return [
    { label: "📁 Создать папку", action: createFolderOnDesktop },
    { label: "📋 Вставить", disabled: !state.clipboard, action: () => doPaste(null) },
    { label: "🔄 Обновить", action: () => toast("Рабочий стол обновлён") }
  ];
}

function menuForItem(id) {
  const item = findItem(id);
  if (!item) return [];

  const items = [{ label: "📂 Открыть", action: () => openItem(id) }];

  if (item.kind !== "shortcut") {
    items.push({ label: "✏️ Переименовать", action: () => startRename(id) });
  }
  if (item.kind === "file" || item.kind === "folder") {
    items.push({ label: "📋 Копировать", action: () => doCopy(id) });
  }
  if (item.kind === "folder") {
    items.push({ label: "📥 Вставить", disabled: !state.clipboard, action: () => doPaste(id) });
  }
  items.push({ label: "🗑️ Удалить", action: () => doDelete(id) });
  return items;
}

function menuForFolderBody(folderId) {
  return [
    { label: "📁 Создать папку", action: () => createFolderInside(folderId) },
    { label: "📋 Вставить", disabled: !state.clipboard, action: () => doPaste(folderId) }
  ];
}

/* ============================================================
   ДЕЙСТВИЯ
   ============================================================ */
function createFolderOnDesktop() {
  state.desktop.push({ id: uid("fld"), name: "Новая папка", kind: "folder", icon: "📁", children: [] });
  state.flags.createdFolder = true;
  refreshSim();
  toast("Папка создана! Теперь дай ей имя.", "success");
}

function createFolderInside(folderId) {
  const folder = findItem(folderId);
  if (!folder || folder.kind !== "folder") return;
  folder.children = folder.children || [];
  folder.children.push({ id: uid("fld"), name: "Новая папка", kind: "folder", icon: "📁", children: [] });
  refreshSim();
  toast("Папка создана внутри «" + folder.name + "»");
}

function doCopy(id) {
  const item = findItem(id);
  if (!item) return;
  state.clipboard = JSON.parse(JSON.stringify(item));
  if (item.kind === "file" && item.name === "Доклад.txt") state.flags.copied = true;
  refreshSim();
  toast("«" + item.name + "» скопирован в буфер обмена");
}

function doPaste(folderId) {
  if (!state.clipboard) { toast("Буфер обмена пуст", "error"); return; }

  const copy = JSON.parse(JSON.stringify(state.clipboard));
  copy.id = uid("cp");
  if (copy.kind === "folder" && !Array.isArray(copy.children)) copy.children = [];

  if (folderId === null) {
    state.desktop.push(copy);
    toast("Копия вставлена на Рабочий стол");
  } else {
    const folder = findItem(folderId);
    if (!folder || folder.kind !== "folder") { toast("Сюда нельзя вставить", "error"); return; }
    folder.children = folder.children || [];
    folder.children.push(copy);
    toast("Копия вставлена в папку «" + folder.name + "»", "success");

    /* Флаг для задания 4 */
    if (folder.name.trim().toLowerCase().replace(/\s+/g, " ") === "мои уроки" &&
        copy.name === "Доклад.txt") {
      state.flags.pasted = true;
    }
  }
  refreshSim();
}

function doDelete(id) {
  const item = findItem(id);
  if (!item) return;
  removeItem(id);
  state.trash.push(item);
  refreshSim();
  toast("«" + item.name + "» перемещён в Корзину 🗑️");
}

function openItem(id) {
  const item = findItem(id);
  if (!item) return;
  if (item.kind === "folder") {
    state.openFolderId = id;
    renderFolderWindow();
    return;
  }
  if (item.kind === "file") toast("Файл «" + item.name + "» открывается…");
  else toast("Программа «" + item.name + "» запускается…");
}

/* Переименование */
let renameTargetId = null;

function startRename(id) {
  const item = findItem(id);
  if (!item) return;
  renameTargetId = id;
  const overlay = document.getElementById("modalOverlay");
  const input   = document.getElementById("modalInput");
  document.getElementById("modalTitle").textContent = "Переименовать «" + item.name + "»";
  input.value = item.name;
  overlay.classList.add("show");
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

function closeRenameModal() {
  document.getElementById("modalOverlay").classList.remove("show");
  renameTargetId = null;
}

function applyRename() {
  if (!renameTargetId) return;
  const item = findItem(renameTargetId);
  const input = document.getElementById("modalInput");
  const newName = input.value.trim().replace(/\s+/g, " ");
  if (!newName) { toast("Имя не может быть пустым", "error"); return; }
  item.name = newName;
  if (item.kind === "folder" && newName.toLowerCase() === "мои уроки") state.flags.renamed = true;
  closeRenameModal();
  refreshSim();
  toast("Новое имя: «" + newName + "»", "success");
}

document.getElementById("modalOk").addEventListener("click", applyRename);
document.getElementById("modalCancel").addEventListener("click", closeRenameModal);
document.getElementById("modalInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") applyRename();
  if (e.key === "Escape") closeRenameModal();
});

/* Окно папки */
function renderFolderWindow() {
  const win = document.getElementById("folderWin");
  const body = document.getElementById("fwBody");
  const folder = state.openFolderId ? findItem(state.openFolderId) : null;

  if (!folder || folder.kind !== "folder") {
    win.style.display = "none";
    state.openFolderId = null;
    return;
  }

  win.style.display = "block";
  document.getElementById("fwName").textContent = "📁 " + folder.name;

  body.innerHTML = "";
  if (!folder.children || folder.children.length === 0) {
    body.innerHTML = '<div class="fw-empty">Папка пуста</div>';
    return;
  }

  folder.children.forEach(child => {
    const el = document.createElement("div");
    el.className = "dicon";
    el.draggable = true;

    let inner = child.icon;
    if (child.kind === "folder" && child.children && child.children.length) {
      inner += '<span class="folder-badge">' + child.children.length + '</span>';
    }
    if (child.kind === "shortcut") inner += '<span class="shortcut-arrow">↗</span>';

    el.innerHTML = '<div class="dicon-img" style="font-size:36px">' + inner + '</div>' +
                   '<div class="dicon-name" style="font-size:13px;color:#14304f;text-shadow:none">' +
                   escapeHtml(child.name) + '</div>';

    el.addEventListener("dragstart", (e) => {
      dragData = { from: "desktop", id: child.id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", child.id);
    });
    el.addEventListener("dragend", () => { dragData = null; });
    el.addEventListener("dblclick", () => openItem(child.id));
    el.addEventListener("contextmenu", (e) => {
      e.preventDefault(); e.stopPropagation();
      showContextMenu(e.clientX, e.clientY, menuForItem(child.id));
    });

    body.appendChild(el);
  });
}

document.getElementById("fwClose").addEventListener("click", () => {
  document.getElementById("folderWin").style.display = "none";
  state.openFolderId = null;
});

/* Правая кнопка внутри папки */
document.getElementById("fwBody").addEventListener("contextmenu", (e) => {
  e.preventDefault(); e.stopPropagation();
  const icon = e.target.closest(".dicon");
  if (icon && icon.dataset.id) {
    const item = findItem(icon.dataset.id);
    if (item) { showContextMenu(e.clientX, e.clientY, menuForItem(item.id)); return; }
  }
  if (state.openFolderId) {
    showContextMenu(e.clientX, e.clientY, menuForFolderBody(state.openFolderId));
  }
});

/* ============================================================
   РАБОЧИЙ СТОЛ — Drag & Drop и контекстное меню
   ============================================================ */
const desktopEl = document.getElementById("desktop");
let dragData = null;

document.getElementById("screen-sim").addEventListener("contextmenu", (e) => e.preventDefault());

desktopEl.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const icon = e.target.closest(".dicon");
  if (icon && icon.dataset.id) {
    const item = findItem(icon.dataset.id);
    if (item) { showContextMenu(e.clientX, e.clientY, menuForItem(item.id)); return; }
  }
  showContextMenu(e.clientX, e.clientY, menuForDesktop());
});

desktopEl.addEventListener("dragover", (e) => {
  if (!dragData) return;
  e.preventDefault();
  desktopEl.classList.add("drop-active");
});
desktopEl.addEventListener("dragleave", (e) => {
  if (e.target === desktopEl) desktopEl.classList.remove("drop-active");
});
desktopEl.addEventListener("drop", (e) => {
  desktopEl.classList.remove("drop-active");
  if (!dragData) return;
  if (e.target.closest(".dicon")) return;
  e.preventDefault();

  if (dragData.from === "program") {
    const prog = state.programs.find(p => p.id === dragData.programId);
    if (!prog) return;
    state.desktop.push({ id: uid("lnk"), name: prog.name, kind: "shortcut", icon: prog.icon });
    state.programs = state.programs.filter(p => p.id !== prog.id);
    if (prog.name === "Paint") state.flags.shortcutOnDesktop = true;
    refreshSim();
    toast("Ярлык «" + prog.name + "» добавлен на Рабочий стол", "success");
    return;
  }

  if (dragData.from === "desktop") {
    const item = findItem(dragData.id);
    if (!item) return;
    const inDesktop = state.desktop.some(x => x.id === item.id);
    if (!inDesktop) {
      removeItem(item.id);
      state.desktop.push(item);
      refreshSim();
      toast("«" + item.name + "» перемещён на Рабочий стол");
    }
  }
});

/* ============================================================
   ЗОНЫ СОРТИРОВКИ
   ============================================================ */
function initSortArea() {
  if (state.sortInit) { renderSortArea(); return; }
  state.sortInit = true;
  state.sortItems = SORT_SOURCE.map(i => ({
    id: i.id, name: i.name, kind: i.kind, icon: i.icon, zone: null
  }));
  renderSortArea();
}

function renderSortArea() {
  const pool = document.getElementById("sortPool");
  pool.innerHTML = '<div class="pool-title">Перетащи значки в нужную зону</div>';
  document.querySelectorAll(".szone-body").forEach(b => b.innerHTML = "");

  state.sortItems.forEach(item => {
    const el = document.createElement("div");
    el.className = "sitem";
    el.draggable = true;
    el.dataset.id = item.id;

    let innerIcon = item.icon;
    if (item.kind === "shortcut") innerIcon += '<span class="shortcut-arrow">↗</span>';

    el.innerHTML = '<div class="ic">' + innerIcon + '</div><div class="nm">' + escapeHtml(item.name) + '</div>';

    el.addEventListener("dragstart", (e) => {
      dragData = { from: "sort", id: item.id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", item.id);
    });
    el.addEventListener("dragend", () => { dragData = null; });

    if (item.zone === null) pool.appendChild(el);
    else {
      const zoneBody = document.querySelector('.szone[data-kind="' + item.zone + '"] .szone-body');
      if (zoneBody) zoneBody.appendChild(el);
    }
  });
}

document.querySelectorAll(".szone").forEach(zone => {
  const kind = zone.dataset.kind;

  zone.addEventListener("dragover", (e) => {
    if (!dragData || dragData.from !== "sort") return;
    e.preventDefault();
    zone.classList.add("dragover");
  });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    zone.classList.remove("dragover");
    if (!dragData || dragData.from !== "sort") return;

    const item = state.sortItems.find(i => i.id === dragData.id);
    if (!item) return;

    if (item.kind === kind) {
      item.zone = kind;
      renderSortArea();
      checkCurrentTask();
    } else {
      const el = document.querySelector('.sitem[data-id="' + item.id + '"]');
      if (el) { el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 420); }
      const names = { file: "это файл 📄", folder: "это папка 📁", shortcut: "это ярлык 🔗" };
      toast("Не сюда: " + names[item.kind], "error");
    }
  });
});

const sortPoolEl = document.getElementById("sortPool");
sortPoolEl.addEventListener("dragover", (e) => {
  if (!dragData || dragData.from !== "sort") return;
  e.preventDefault();
});
sortPoolEl.addEventListener("drop", (e) => {
  e.preventDefault();
  if (!dragData || dragData.from !== "sort") return;
  const item = state.sortItems.find(i => i.id === dragData.id);
  if (!item) return;
  item.zone = null;
  renderSortArea();
});

/* ============================================================
   ЛОГИКА ЗАДАНИЙ + ПОДСКАЗКА С МЫШЬЮ
   ============================================================ */
function renderTask() {
  const i = state.index;
  if (i >= TASKS.length) { finishSim(); return; }

  const task = TASKS[i];
  document.getElementById("s2num").textContent = (i + 1);
  document.getElementById("s2task").textContent = task.text;
  document.getElementById("hintText").textContent = task.hint;

  /* Подсвечиваем нужную кнопку мыши */
  const leftPath  = document.getElementById("mouseLeftPath");
  const rightPath = document.getElementById("mouseRightPath");
  const label     = document.getElementById("mouseLabel");

  leftPath.classList.toggle("active",  task.btn === "left");
  rightPath.classList.toggle("active", task.btn === "right");

  if (task.btn === "left") {
    label.textContent = "ЛКМ";
    label.style.color = "#b45309";
    label.style.background = "#fef3c7";
    label.style.borderColor = "#f59e0b";
  } else {
    label.textContent = "ПКМ";
    label.style.color = "#1e40af";
    label.style.background = "#dbeafe";
    label.style.borderColor = "#3b82f6";
  }

  updateDots();

  const useSort = (i >= 7);
  document.getElementById("desktopArea").style.display = useSort ? "none" : "flex";
  document.getElementById("sortWrap").style.display    = useSort ? "flex" : "none";
  if (useSort) initSortArea();
}

function updateDots() {
  const i = state.index;
  const dots = document.getElementById("s2dots");
  dots.innerHTML = "";
  for (let k = 0; k < TASKS.length; k++) {
    const d = document.createElement("div");
    d.className = "dot" + (state.done[k] ? " done" : "") + (k === i ? " current" : "");
    dots.appendChild(d);
  }
}

let advancing = false;
let advanceTimer = null;

function checkCurrentTask() {
  if (advancing) return;
  const i = state.index;
  if (i >= TASKS.length) return;
  if (state.done[i]) return;

  if (TASKS[i].check()) {
    state.done[i] = true;
    state.doneCount++;
    updateDots();
    toast("✅ Задание " + (i + 1) + " выполнено!", "success");

    advancing = true;
    advanceTimer = setTimeout(() => {
      advanceTimer = null;
      advancing = false;
      nextTask();
    }, 950);
  }
}

let skipLock = false;
function skipCurrentTask() {
  if (skipLock) return;
  skipLock = true;
  setTimeout(() => { skipLock = false; }, 350);
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  advancing = false;
  nextTask();
}
document.getElementById("skipBtn").addEventListener("click", skipCurrentTask);

/* Кнопка «Завершить» — работает даже если не все задания выполнены */
document.getElementById("finishBtn").addEventListener("click", () => {
  const remaining = 10 - state.doneCount;
  if (remaining > 0) {
    const ok = confirm(
      "Завершить тренажёр сейчас?\n\n" +
      "Выполнено заданий: " + state.doneCount + " из 10.\n" +
      "Не выполнено: " + remaining + ".\n\n" +
      "Вы получите " + state.doneCount + " баллов из 10."
    );
    if (!ok) return;
  }
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  advancing = false;
  finishSim();
});

function nextTask() {
  state.index++;
  if (state.index >= TASKS.length) { finishSim(); return; }
  renderTask();
}

function refreshSim() {
  renderDesktop();
  renderProgramBar();
  if (state.openFolderId) renderFolderWindow();
  checkCurrentTask();
}

/* ============================================================
   ИТОГИ — 10 баллов (по 1 за каждое задание)
   ============================================================ */
function finishSim() {
  const score = state.doneCount;   // 0–10

  document.getElementById("finalName").textContent = state.name;
  document.getElementById("finalScore").textContent = score;

  const contextDone = state.done.slice(0, 5).filter(Boolean).length;   // задания 1–5
  const dragDone    = state.done.slice(5, 7).filter(Boolean).length;   // задания 6–7
  const sortDone    = state.done.slice(7, 10).filter(Boolean).length;  // задания 8–10

  const d1ok = contextDone >= 4;
  const d2ok = dragDone >= 2;
  const d3ok = sortDone >= 3;

  const rows = [
    { text: "Владеет навыками работы с контекстным меню (создание, переименование, копирование, вставка, удаление файлов и папок)",
      ok: d1ok, info: "Выполнено: " + contextDone + " из 5" },
    { text: "Умеет перетаскивать файлы и ярлыки мышью (Drag-and-Drop)",
      ok: d2ok, info: "Выполнено: " + dragDone + " из 2" },
    { text: "Различает файлы, папки и ярлыки по значкам на Рабочем столе",
      ok: d3ok, info: "Выполнено: " + sortDone + " из 3" }
  ];

  const tbody = document.getElementById("descBody");
  tbody.innerHTML = "";
  rows.forEach(row => {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td");
    td1.textContent = row.text;
    td1.title = row.info;
    const td2 = document.createElement("td");
    const span = document.createElement("span");
    span.className = row.ok ? "badge-ok" : "badge-rep";
    span.textContent = row.ok ? "✔ Выполнено" : "↻ Требуется повторение";
    td2.appendChild(span);
    tr.appendChild(td1); tr.appendChild(td2);
    tbody.appendChild(tr);
  });

  showScreen("screen-final");
}

/* ============================================================
   ПЕРЕЗАПУСК
   ============================================================ */
document.getElementById("restartBtn").addEventListener("click", () => {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  advancing = false;
  hideContextMenu();
  document.getElementById("folderWin").style.display = "none";
  nameInput.value = state.name;
  startBtn.disabled = nameInput.value.trim().length < 2;
  loginHint.textContent = "";
  showScreen("screen-login");
});
</script>
</body>
